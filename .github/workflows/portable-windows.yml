# Builds Hypersuperfluid's desktop app: for Windows x64 a portable zip that keeps all state in its own folder and an
# installer, and for macOS a disk image each for Apple Silicon and Intel. All are unsigned (the Mac apps are ad-hoc
# signed). Run it from the Actions tab; pushing a tag such as v0.2.2 also publishes them all to one release.
name: Desktop builds (Windows and macOS)

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: portable-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ONLYOFFICE's editors (ranuts/document), built once and shipped in the bundle's office-editor/ folder.
  office-editor:
    uses: ./.github/workflows/office-editor.yml

  portable:
    name: Windows x64 portable and installer
    needs: office-editor
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: '^24.22.3'
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm run build:artifacts
      # The repository build covers packages/*/* and apps/cli only, and lib/ is git-ignored, so without this step the
      # bundle ships without its code and the app starts as plain DeepSeek Harness.
      - uses: actions/download-artifact@v7
        with:
          name: office-editor
          path: apps/hypersuperfluid/office-editor
      - name: Build the Hypersuperfluid bundle
        shell: pwsh
        run: |
          pnpm --filter @deepseek-ai/dsh-hypersuperfluid run build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $missing = 'brand.js', 'client.js', 'workers.js', 'acp-chat.js', 'mcp-bridge.js', 'handoff.js', 'portal.js' |
            Where-Object { -not (Test-Path "apps/hypersuperfluid/lib/$_") }
          if ($missing) { Write-Error "The Hypersuperfluid bundle build is missing lib/$($missing -join ', lib/')"; exit 1 }
          # The repository typecheck does not cover the bundle, and its build does not check types.
          pnpm exec tsc --noEmit -p apps/hypersuperfluid
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      # Local packaging settings. There are no secrets in them: the update origins are placeholders, so update
      # checks in this build fail harmlessly.
      - name: Write packaging settings
        shell: pwsh
        run: |
          $releaseId = -join ((1..32) | ForEach-Object { '{0:x}' -f (Get-Random -Maximum 16) })
          @(
            'DSH_DESKTOP_APP_ID=com.hypersuperfluid.desktop'
            'DSH_DESKTOP_AUTO_UPDATE_ENV=test'
            'DOWNLOAD_TEST_ORIGIN=https://updates.example.invalid'
            "DOWNLOAD_TEST_RELEASE_ID=$releaseId"
            'DSH_DESKTOP_MANDATORY_UPDATE_TEST_ORIGIN=https://updates.example.invalid'
            'DSH_DESKTOP_MANDATORY_UPDATE_PROD_ORIGIN=https://updates.example.invalid'
            "DSH_DESKTOP_MANDATORY_UPDATE_CONFIG='{""allowedAuthOrigins"":[""https://updates.example.invalid""]}'"
            'DSH_DESKTOP_WINDOWS_CER_FILE='
            'DSH_DESKTOP_WINDOWS_SIGNTOOL='
            'DSH_DESKTOP_WINDOWS_KEY_CONTAINER='
            'DSH_DESKTOP_WINDOWS_TOKEN_PIN='
            'DSH_DESKTOP_WINDOWS_SIGNATURE_CACHE_CONCURRENCY=4'
            'DSH_DESKTOP_WINDOWS_COMPRESSION_LEVEL=3'
          ) | Set-Content -Path apps/desktop/.env.windows -Encoding utf8NoBOM
      - name: Package
        run: pnpm run package:desktop:win:x64:unsigned
      - name: Check the app carries the Hypersuperfluid bundle
        shell: pwsh
        run: |
          $tarball = Get-ChildItem apps/desktop/.desktop-build/targets/win-x64/packed -Recurse -Filter 'deepseek-ai-dsh-hypersuperfluid-*.tgz' |
            Select-Object -First 1
          if ($null -eq $tarball) { Write-Error 'No Hypersuperfluid bundle tarball was packed'; exit 1 }
          $files = tar -tzf $tarball.FullName
          foreach ($file in 'package/lib/brand.js', 'package/lib/client.js', 'package/cordis.patch.yml', 'package/office-editor/editor.html') {
            if ($files -notcontains $file) { Write-Error "$($tarball.Name) lacks $file"; exit 1 }
          }
          "$($tarball.Name): $($files.Count) files, including lib/brand.js and lib/client.js"
      # The files are named after the tag, which can move ahead of the package version for a rebuilt release.
      - name: Assemble the portable folder and zip it
        id: portable
        shell: pwsh
        run: |
          $folder = node apps/hypersuperfluid/portable/assemble.mjs
          $version = if ('${{ github.ref }}'.StartsWith('refs/tags/v')) { '${{ github.ref_name }}'.TrimStart('v') } else { "dev.${{ github.run_number }}" }
          $zip = "dist-portable/Hypersuperfluid-$version-win-x64-portable.zip"
          $setup = "dist-portable/Hypersuperfluid-$version-win-x64-setup-unsigned.exe"
          7z a -tzip -mx=7 $zip "$folder" | Out-Null
          $installer = Get-ChildItem apps/desktop/.desktop-build/targets/win-x64/unsigned-artifacts -Filter 'hypersuperfluid-*-unsigned.exe' |
            Select-Object -First 1
          Copy-Item $installer.FullName $setup
          "zip=$zip" >> $env:GITHUB_OUTPUT
          "installer=$setup" >> $env:GITHUB_OUTPUT
          Get-Item $zip, $setup | ForEach-Object { '{0} {1:N0} MB' -f $_.Name, ($_.Length / 1MB) }
      - uses: actions/upload-artifact@v7
        with:
          name: hypersuperfluid-win-x64-portable
          path: ${{ steps.portable.outputs.zip }}
          compression-level: 0
          retention-days: 30
      - uses: actions/upload-artifact@v7
        with:
          name: hypersuperfluid-win-x64-installer
          path: ${{ steps.portable.outputs.installer }}
          compression-level: 0
          retention-days: 30

  macos:
    name: macOS ${{ matrix.arch }} disk image
    needs: office-editor
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: arm64, runner: macos-latest }
          - { arch: x64, runner: macos-15-intel }
    defaults:
      run:
        shell: bash
    env:
      DSH_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: '^24.22.3'
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm run build:artifacts
      - uses: actions/download-artifact@v7
        with:
          name: office-editor
          path: apps/hypersuperfluid/office-editor
      - name: Build the Hypersuperfluid bundle
        run: |
          pnpm --filter @deepseek-ai/dsh-hypersuperfluid run build
          for file in brand.js client.js workers.js acp-chat.js mcp-bridge.js handoff.js portal.js; do
            test -f "apps/hypersuperfluid/lib/$file" || { echo "::error::The Hypersuperfluid bundle build is missing lib/$file"; exit 1; }
          done
      # Unsigned Mac packaging reads no settings file: it uses the app id com.hypersuperfluid.desktop and ad-hoc signs.
      # The packager's self-test converts Office files with LibreOffice, whose first start can outlast its timeout on
      # the slower Intel runners, so a failed attempt is tried once more from a clean build folder.
      - name: Package
        run: |
          if pnpm run package:desktop:mac:${{ matrix.arch }}:unsigned; then exit 0; fi
          echo '::warning::Packaging failed once; trying again'
          rm -rf apps/desktop/.desktop-build/targets/mac-${{ matrix.arch }}
          pnpm run package:desktop:mac:${{ matrix.arch }}:unsigned
      - name: Check the app carries the Hypersuperfluid bundle
        run: |
          tarball=$(find apps/desktop/.desktop-build/targets/mac-${{ matrix.arch }}/packed -name 'deepseek-ai-dsh-hypersuperfluid-*.tgz' | head -1)
          test -n "$tarball" || { echo '::error::No Hypersuperfluid bundle tarball was packed'; exit 1; }
          files=$(tar -tzf "$tarball")
          for file in package/lib/brand.js package/lib/client.js package/cordis.patch.yml package/office-editor/editor.html; do
            grep -qx "$file" <<<"$files" || { echo "::error::$(basename "$tarball") lacks $file"; exit 1; }
          done
          echo "$(basename "$tarball"): $(wc -l <<<"$files") files, including lib/brand.js and lib/client.js"
      - name: Name the disk image
        id: dmg
        run: |
          if [[ '${{ github.ref }}' == refs/tags/v* ]]; then version='${{ github.ref_name }}'; version=${version#v}; else version="dev.${{ github.run_number }}"; fi
          built=$(find apps/desktop/.desktop-build/targets/mac-${{ matrix.arch }}/unsigned-artifacts -name 'hypersuperfluid-*.dmg' | head -1)
          test -n "$built" || { echo '::error::No disk image was built'; exit 1; }
          mkdir -p dist-mac
          dmg="dist-mac/Hypersuperfluid-$version-mac-${{ matrix.arch }}-unsigned.dmg"
          cp "$built" "$dmg"
          echo "dmg=$dmg" >> "$GITHUB_OUTPUT"
          ls -lh "$dmg"
      - uses: actions/upload-artifact@v7
        with:
          name: hypersuperfluid-mac-${{ matrix.arch }}
          path: ${{ steps.dmg.outputs.dmg }}
          compression-level: 0
          retention-days: 30

  release:
    name: Publish to a release
    needs: [portable, macos]
    # Windows must build; a Mac image that failed is left out rather than holding back the release.
    if: startsWith(github.ref, 'refs/tags/v') && !cancelled() && needs.portable.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: hypersuperfluid-*
          path: dist
          merge-multiple: true
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: |
            Unsigned builds.

            **Windows x64.** Portable: extract the zip and run Hypersuperfluid.cmd. Installer: run the .exe. SmartScreen may warn on first start; choose More info, then Run anyway.

            **macOS.** Take `mac-arm64` for Apple Silicon (M1 and later) or `mac-x64` for Intel. Open the disk image and drag Hypersuperfluid to Applications. The app is not notarized, so before the first start run `xattr -dr com.apple.quarantine /Applications/Hypersuperfluid.app` in Terminal, or open it once and then choose Open Anyway in System Settings → Privacy & Security.
        run: |
          ls -lh dist
          gh release create '${{ github.ref_name }}' dist/* -R '${{ github.repository }}' \
            --title 'Hypersuperfluid ${{ github.ref_name }}' --prerelease --notes "$NOTES"
