# Builds the Office editors Hypersuperfluid ships: ONLYOFFICE's Word, Excel, PowerPoint and PDF editors as packaged by
# ranuts/document (AGPL-3.0), pinned to one release. The desktop builds call this workflow and put its output in
# apps/hypersuperfluid/office-editor; run it alone from the Actions tab to get the editor for local testing.
name: Office editor

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

env:
  EDITOR_REPOSITORY: ranuts/document
  EDITOR_REF: v0.0.9

jobs:
  build:
    name: Build ONLYOFFICE editors (ranuts/document)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          repository: ${{ env.EDITOR_REPOSITORY }}
          ref: ${{ env.EDITOR_REF }}
          path: document
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: document/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install
        working-directory: document
        run: pnpm install --frozen-lockfile
      - name: Build
        working-directory: document
        run: pnpm run build
      # Hypersuperfluid frames only editor.html. Left out, about 70 MB: the website's pages and their translations, the
      # Visio editor (no .vsdx support here), and the on-device models of the editor's own AI assistant, which the
      # app's chat replaces. Checked by opening .docx, .xlsx, .pptx and .pdf files in a build without them.
      - name: Leave out what the app does not use
        working-directory: document/dist
        run: |
          du -sh .
          missing=0
          for path in about.html ai-document-assistant.html changelog.html contact.html \
            edit-documents-without-account.html embed-demo.html embed-document-editor.html \
            no-signup-document-editor.html offline-document-editor.html onlyoffice-online-free.html \
            private-document-editor.html webmcp-document-editor.html help help.html history.html \
            sitemap.xml llms.txt llms-full.txt social de es ja ko pt zh-CN \
            sdkjs/visio web-apps/apps/visioeditor; do
            if [ -e "$path" ]; then rm -rf "$path"; else echo "::warning::$path is no longer in the build"; missing=1; fi
          done
          shopt -s nullglob
          models=(assets/wllama-*.wasm assets/webllm.worker-*.js)
          [ ${#models[@]} -gt 0 ] || { echo "::warning::no on-device model files found"; missing=1; }
          rm -f "${models[@]}"
          [ "$missing" = 0 ] || echo "::warning::The editor's layout changed; review this list against $EDITOR_REF"
      - name: Record what was built
        run: |
          test -f document/dist/editor.html
          du -sh document/dist
          printf '%s@%s\n' "$EDITOR_REPOSITORY" "$EDITOR_REF" > document/dist/HSF-SOURCE.txt
          cp document/LICENSE document/dist/LICENSE-AGPL-3.0.txt
          cp document/NOTICE document/dist/NOTICE.txt 2>/dev/null || true
      - uses: actions/upload-artifact@v7
        with:
          name: office-editor
          path: document/dist
          retention-days: 30
