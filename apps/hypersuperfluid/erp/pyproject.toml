[project]
name = "erp-agent"
version = "0.1.0"
description = "Odoo agent: read-only Odoo data server and Odoo customization and module tools (MCP), Odoo skills, and Hermes / DeepSeek Harness runtime profiles"
authors = [
    { name = "senote27", email = "senote27@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "defusedxml>=0.7",
    "httpx>=0.27",
    "lxml>=5",
    "mcp>=2.2,<3",
    "openpyxl>=3.1",
    "pandas>=2.2",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "pyyaml>=6",
    "trafilatura>=2.0",
]

[project.optional-dependencies]
pdf = [
    "pdfplumber>=0.11",
]

[build-system]
requires = ["uv_build>=0.8.15,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "lxml-stubs>=0.5.1",
    "mypy>=1.10",
    "pandas-stubs>=3.0.5.260914",
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5",
    "ruff>=0.5",
    "types-defusedxml>=0.7.0.20260504",
    "types-pyyaml>=6.0.12.20260906",
]

[project.scripts]
erp-mcp = "erp_agent.mcp_server:main"
erp-customize = "erp_agent.customize.server:main"
erp-docs = "erp_agent.docs_fetch:cli"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--cov=erp_agent --cov-report=term-missing --cov-fail-under=80"

[tool.coverage.run]
branch = true

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B017"]
# Build scripts run fixed git, npm, dsh and uv commands.
"scripts/**" = ["S603", "S607"]
# Module tools run git and the configured Odoo test command with argument lists, never a shell.
"src/erp_agent/modules/runner.py" = ["S603"]
"src/erp_agent/modules/workspace.py" = ["S603", "S607"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
files = ["src"]
